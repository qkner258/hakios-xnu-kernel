name: build-cas-kernel-dbg
on:
  workflow_dispatch:
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang lld llvm libssl-dev uuid-dev flex bison m4 perl python3 autoconf automake libtool pkg-config
      - name: theos
        run: |
          git clone --depth 1 https://github.com/theos/theos "$HOME/theos"
          cd "$HOME/theos" && yes | bash bin/install-theos
      - name: xnu-source
        run: xnu/apply.sh
      - name: diagnostics
        run: |
          echo '' | base64 -d > /tmp/patch-hk-diag.py
          python3 /tmp/patch-hk-diag.py
      - name: deps-xnu
        run: |
          export THEOS="$HOME/theos"
          xnu-deps/setup.sh
      - name: config
        run: make defconfig
      - name: build
        run: |
          export THEOS="$HOME/theos"
          ulimit -s unlimited
          make kernel JOBS=4
      - name: collect
        if: always()
        run: |
          mkdir -p out
          K=$(find xnu-src -name 'mach.*unstripped' | head -1) || true
          if [ -n "$K" ]; then
            llvm-strip-18 -S -o out/hakios-kernel-dbg "$K" || cp "$K" out/hakios-kernel-dbg
          fi
          ls -l out || true
      - uses: actions/upload-artifact@v4
        with:
          name: cas-kernel-dbg
          path: out/hakios-kernel-dbg
