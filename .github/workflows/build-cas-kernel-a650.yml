name: build-cas-kernel-a650
on:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      XNU_SRC: ${{ github.workspace }}/out/xiaomi-mi-10/xnu
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang lld llvm libssl-dev uuid-dev flex bison m4 perl python3 autoconf automake libtool pkg-config

      - name: theos
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/theos/theos "$HOME/theos"
          cd "$HOME/theos"
          ok=0
          for i in 1 2 3; do
            if yes | bash bin/install-theos; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" = 1 ] || echo "::warning::theos install did not finish (SDK optional)"

      - name: device layer
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/xm6661885/hakios-xnu-kernel-umi-fixes /tmp/umi
          cd /tmp/umi && git sparse-checkout set devices/xiaomi-mi-10
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/umi/devices/xiaomi-mi-10 devices/
          echo "files: $(find devices/xiaomi-mi-10 -type f | wc -l)"
          ls -l devices/xiaomi-mi-10/overlays/xnu/files/bsd/dev/hakios.adreno.c

      - name: xnu tree + device overlay
        run: |
          python3 devices/xiaomi-mi-10/prepare.py kernel
          echo "--- 树里的 GPU 三件套自检 ---"
          wc -c "$XNU_SRC/bsd/dev/hakios.adreno.c"
          echo "umi_a650 出现次数: $(grep -c umi_a650 "$XNU_SRC/bsd/dev/hakios.adreno.c")"
          wc -c "$XNU_SRC/iokit/Kernel/hakios.gpu.cpp"
          grep -c CONFIG_HAKIOS_ADRENO "$XNU_SRC/config/MASTER.hakios" || true

      # 44502962653 那次：deps-xnu 过了，编译在 57 秒时死在 bsd/dev/hakios.umi_bluetooth.o ——
      # umi_bluetooth.c 里 #include "umi_bt_firmware.inc"，那是 build-kernel.sh 用
      # tools/embed-firmware.py 从 fw-bluetooth/ 生成的，a650 这条流程没接这一步。
      # 固件不在树里时脚本会生成空数组（read() 对缺文件返回 b''），BT 不通但不影响 GPU。
      - name: bt firmware include
        run: |
          python3 devices/xiaomi-mi-10/tools/embed-firmware.py \
            --patch fw-bluetooth/htbtfw20.tlv --nvm fw-bluetooth/htnv20.bin \
            --output "$XNU_SRC/bsd/dev/umi_bt_firmware.inc"
          echo "--- 还有没有别的 .inc 缺 ---"
          cd "$XNU_SRC/bsd/dev"
          grep -oh '#include "[^"]*\.inc"' *.c *.inc 2>/dev/null | sed 's/#include "//;s/"//' | sort -u |
            while read -r f; do [ -f "$f" ] || echo "MISSING $f"; done

      # 诊断：上一次（44462294462）就死在这一步，日志拿不到，所以让它自己说明死在哪。
      # 行为不变，只是 -x + 失败时把最后 120 行打出来。
      - name: deps-xnu
        run: |
          export THEOS="$HOME/theos"
          echo "--- deps 现场 ---"
          echo "THEOS=$THEOS"
          ls -l "$THEOS/toolchain/linux/iphone/bin/ld" || echo "NO cctools ld"
          ls -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" || echo "NO iPhoneOS16.5.sdk"
          ls "$THEOS/sdks" 2>/dev/null || true
          which clang flex bison m4 perl python3 autoconf automake xz tar curl git || true
          echo "XNU_SRC=$XNU_SRC"
          ls "$XNU_SRC/makedefs/MakeInc.def" || echo "NO kernel tree at XNU_SRC"
          set +e
          bash -x xnu-deps/setup.sh > /tmp/deps.log 2>&1
          rc=$?
          echo "deps-xnu exit: $rc"
          if [ "$rc" = 0 ]; then tail -5 /tmp/deps.log; else
            echo "--- tail 120 ---"; tail -120 /tmp/deps.log
          fi
          exit $rc

      - name: build
        run: |
          export THEOS="$HOME/theos"
          ulimit -s unlimited
          set +e
          ./xnu-build.sh -j4 > /tmp/build.log 2>&1
          echo "xnu-build exit: $?"
          echo "--- 头几条 error（tail -80 会被 make 的 Leaving directory 淹掉）---"
          grep -n -m20 -iE 'error:|fatal error|No such file' /tmp/build.log || true
          tail -80 /tmp/build.log
          KERNEL="$XNU_SRC/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837" \
            tools/make-kernel.sh --judge /tmp/build.log

      - name: collect
        if: always()
        run: |
          mkdir -p out
          K=$(find "$XNU_SRC/BUILD" -name 'mach.*unstripped' 2>/dev/null | head -1)
          [ -n "$K" ] || K=$(find "$XNU_SRC/BUILD" -name 'mach.development.bcm2837' 2>/dev/null | head -1)
          if [ -n "$K" ]; then
            llvm-strip-18 -S -o out/hakios-kernel "$K" || cp "$K" out/hakios-kernel
            ls -lh out/hakios-kernel
            echo "--- 这个内核里有没有 A650 路径 ---"
            echo "umi_a650: $(strings -a out/hakios-kernel | grep -c _umi_a650 || true)"
            echo "a650_gmu: $(strings -a out/hakios-kernel | grep -c a650_gmu || true)"
          else
            echo "::error::no kernel produced; see the build log above"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cas-kernel-a650
          path: out/hakios-kernel
          if-no-files-found: warn
