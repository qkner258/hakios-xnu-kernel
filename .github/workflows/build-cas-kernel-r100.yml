name: build-cas-kernel
on:
  workflow_dispatch:
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      XNU_SRC: ${{ github.workspace }}/out/xiaomi-mi-10/xnu
      KERNEL: ${{ github.workspace }}/out/xiaomi-mi-10/xnu/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang lld llvm libssl-dev uuid-dev flex bison m4 perl python3 autoconf automake libtool pkg-config
      # The device layer is not committed here: it is the upstream UMI tree, pinned by its HEAD.
      - name: umi device layer
        run: |
          git clone --depth 1 https://github.com/xm6661885/hakios-xnu-kernel-umi-fixes /tmp/umi
          git -C /tmp/umi log --oneline -1
          rm -rf devices/xiaomi-mi-10
          mkdir -p devices
          cp -a /tmp/umi/devices/xiaomi-mi-10 devices/
          ls devices/xiaomi-mi-10 | head -5
      # 借用 UniXNU-cas 的 ci/xnu/toolchain.json 思路：每轮构建把"编的是哪棵树、什么身份"钉死，
      # 随 artifact 一起出来。我们此前踩过"这轮编的是哪棵树"的坑，这一份就是答案。
      - name: toolchain identity
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def sh(*a):
              try:
                  return subprocess.run(a, capture_output=True, text=True).stdout.strip()
              except Exception:
                  return ""
          doc = {
              "runner": "ubuntu-24.04",
              "xnu_source": "apple-oss-distributions/xnu xnu-8796.121.2",
              "darwin": "22.5.0",
              "target_system": {"version": "16.5", "build": "20F66"},
              "kernel_config": "DEVELOPMENT_ARM64_BCM2837",
              "page_size": 4096,
              "framework": sh("git", "rev-parse", "HEAD"),
              "device_layer": sh("git", "-C", "/tmp/umi", "rev-parse", "HEAD"),
              "device_layer_subject": sh("git", "-C", "/tmp/umi", "log", "-1", "--pretty=%s"),
              "clang": (sh("clang", "--version").splitlines() or [""])[0],
          }
          sdk = pathlib.Path(os.environ.get("HOME", "")) / "theos/sdks"
          doc["theos_sdks"] = sorted(p.name for p in sdk.glob("*.sdk")) if sdk.is_dir() else []
          out = pathlib.Path("out/toolchain.json")
          out.write_text(json.dumps(doc, indent=2) + "\n")
          print(out.read_text())
          PY

      - name: theos
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/theos/theos "$HOME/theos"
          cd "$HOME/theos"
          ok=0
          for i in 1 2 3; do
            if yes | bash bin/install-theos; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" = 1 ] || echo "::warning::theos install did not finish (SDK optional)"
      # devices/xiaomi-mi-10/build-kernel.sh is the authority for the order that follows;
      # these steps reproduce it, with the diagnostic patches this kernel needs added in place.
      - name: xnu-source + device overlay
        run: |
          python3 devices/xiaomi-mi-10/prepare.py kernel
          grep -c . "$XNU_SRC/bsd/dev/hakios.adreno.c" || true
      # bsd/dev/umi_bluetooth.c includes umi_bt_firmware.inc; build-kernel.sh makes it from the
      # git-ignored QCA6390 firmware. The script writes an empty array when the firmware is absent.
      # The build directory is made here too, as mk-wlfw.sh requires it to exist.
      - name: bluetooth firmware include + build dir
        run: |
          python3 devices/xiaomi-mi-10/tools/embed-firmware.py \
            --patch fw-bluetooth/htbtfw20.tlv --nvm fw-bluetooth/htnv20.bin \
            --output "$XNU_SRC/bsd/dev/umi_bt_firmware.inc"
          wc -c "$XNU_SRC/bsd/dev/umi_bt_firmware.inc"
          mkdir -p "$XNU_SRC/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/bsd/DEVELOPMENT"
      # Apple's pid 1 candidate list is /sbin/launchd only; our root's init is /sbin/init.
      - name: pid 1 accepts /sbin/init
        run: |
          python3 - "$XNU_SRC/bsd/kern/kern_exec.c" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          if '"/sbin/init"' in s:
              print('pid1: /sbin/init already listed')
              raise SystemExit
          anchor = '\t"/sbin/launchd",\n};\n'
          if anchor not in s:
              raise SystemExit('pid1: init candidate list is not where it was; refusing to guess')
          p.write_text(s.replace(anchor, '\t"/sbin/launchd",\n\t"/sbin/init",\n};\n', 1))
          print('pid1: /sbin/init added')
          PY
      # apfs 挂载在 umi 树上返回 EINVAL（r92/r93 已排除设备名与 GPU）。这三条探针用来分流：
      # 一条都不出现 => 请求在 VFS 层就被拒（fstype 没注册），根本没进 apfs_mount；
      # 出现了 => 看哪一条的返回值是 22，就知道是 lookup、open 还是卷校验拒绝的。
      - name: apfs mount trace
        run: |
          python3 - "$XNU_SRC/bsd/miscfs/apfs/apfs_vfsops.c" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          if 'apfs-trace' in s:
              print('apfs-trace: already inserted')
              raise SystemExit
          reps = [
              ('\tif (error == 0) {\n\t\terror = vnode_lookup(path, 0, &vp, ctx);\n\t}\n',
               '\tif (error == 0) {\n\t\terror = vnode_lookup(path, 0, &vp, ctx);\n\t}\n'
               '\tprintf("apfs-trace: %s: lookup %d vp %p blk %d\\n", path, error, (void *)vp, vp != NULLVP ? vnode_isblk(vp) : -1);\n'),
              ('\t\terror = VNOP_OPEN(vp, FREAD, ctx);\n',
               '\t\t\terror = VNOP_OPEN(vp, FREAD, ctx);\n'
               '\t\tprintf("apfs-trace: open %s: %d\\n", path, error);\n'),
              ('\t\t\terror = apfs_mount_common(mp, vp, ctx, container, volume);\n',
               '\t\t\terror = apfs_mount_common(mp, vp, ctx, container, volume);\n'
               '\t\t\tprintf("apfs-trace: mount_common %s: %d\\n", path, error);\n'),
              # 第二组：进 mount_common 之后，块大小 / 第 0 块读回 / NXSB 魔数，三处都在 EINVAL 之前
              ('\tif (VNOP_IOCTL(devvp, DKIOCGETBLOCKSIZE, (caddr_t)&devblock, 0, ctx) != 0 ||\n',
               '\t{ uint32_t _b = 0; int _e = VNOP_IOCTL(devvp, DKIOCGETBLOCKSIZE, (caddr_t)&_b, 0, ctx);\n'
               '\t  printf("apfs-trace: devblock %u ioctl-err %d chunk %u\\n", _b, _e, (unsigned)APFS_META_CHUNK); }\n'
               '\tif (VNOP_IOCTL(devvp, DKIOCGETBLOCKSIZE, (caddr_t)&devblock, 0, ctx) != 0 ||\n'),
              ('\t\t\terror = apfs_dev_read(dc, 0, sb, APFS_META_CHUNK);\n',
               '\t\t\terror = apfs_dev_read(dc, 0, sb, APFS_META_CHUNK);\n'
               '\t\t\tprintf("apfs-trace: read0 err %d magic %02x%02x%02x%02x at32\\n", error,\n'
               '\t\t\t    error == 0 ? sb[32] : 0, error == 0 ? sb[33] : 0, error == 0 ? sb[34] : 0,\n'
               '\t\t\t    error == 0 ? sb[35] : 0);\n'),
              ('\t\t\tif (error == 0 && memcmp(sb + 32, "NXSB", 4) != 0) {\n',
               '\t\t\tif (error == 0 && memcmp(sb + 32, "NXSB", 4) != 0) {\n'
               '\t\t\t\tprintf("apfs-trace: NXSB missing, this is not a container\\n");\n'),
          ]
          for old, new in reps:
              if old not in s:
                  raise SystemExit('apfs-trace: anchor missing: ' + repr(old[:40]))
              s = s.replace(old, new, 1)
          p.write_text(s)
          print('apfs-trace: inserted 3 probes')
          PY
      # 显示交权：现在 backboardd 确实在提交 BGRA 帧（swap 1..5），但那层启动文本不退场。
      # 原代码只在 s->info.bytesPerElement == 4 && planeCount == 0 时才把屏幕交给 UI；
      # 这里先把判定打印出来，并且第一帧就无条件交权（文本停画），这样屏幕上能看见到底有没有 UI。
      - name: display bootlog handover
        run: |
          python3 - "$XNU_SRC/iokit/Kernel/MiniIOMobileFramebuffer.cpp" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          if 'fbgraphics:' in s:
              print('fbgraphics: already inserted')
              raise SystemExit
          old = '\t\tif (s->info.bytesPerElement == 4 && s->info.planeCount == 0) {\n'
          if old not in s:
              raise SystemExit('fbgraphics: anchor missing')
          new = ('\t\tif (!fGraphics) {\n'
                 '\t\t\thakios_tl("fbgraphics: first frame, be %u planes %u: handover now\\n",\n'
                 '\t\t\t    s->info.bytesPerElement, s->info.planeCount);\n'
                 '\t\t\tfGraphics = true;\n'
                 '\t\t\tPE_initialize_console(NULL, kPEGraphicsMode);\n'
                 '\t\t\thakios_bootlog_stop(0);\n'
                 '\t\t}\n'
                 + old)
          p.write_text(s.replace(old, new, 1))
          print('fbgraphics: handover inserted')
          PY
      - name: deps-xnu
        run: |
          export THEOS="$HOME/theos"
          xnu-deps/setup.sh
      - name: build
        run: |
          export THEOS="$HOME/theos"
          export XNU_SRC="$PWD/out/xiaomi-mi-10/xnu"
          export KERNEL="$XNU_SRC/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837"
          ulimit -s unlimited
          set +e
          [ ! -f xnu-deps/build/ath11k/src/ath11k/qmi.c ] || tools/mk-wlfw.sh
          ./xnu-build.sh -k -j4 > /tmp/build.log 2>&1
          echo "xnu-build exit: $?"
          echo "---- first errors ----"
          grep -nE "error:|fatal error|No such file|cannot find|undefined reference" /tmp/build.log | head -40
          echo "---- tail ----"
          tail -40 /tmp/build.log
          KERNEL="$KERNEL" tools/make-kernel.sh --judge /tmp/build.log
      - name: collect
        if: always()
        run: |
          mkdir -p out
          K=$(find out/xiaomi-mi-10 -name 'mach.*unstripped' 2>/dev/null | head -1) || true
          [ -n "$K" ] || K=$(find out/xiaomi-mi-10 -name 'mach.development.bcm2837' 2>/dev/null | head -1) || true
          if [ -n "$K" ]; then
            llvm-strip-18 -S -o out/hakios-kernel "$K" || cp "$K" out/hakios-kernel
            ls -lh out/hakios-kernel
          else
            echo "::error::no kernel produced; see build.log in the artifacts"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-identity
          path: out/toolchain.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: cas-kernel
          path: out/hakios-kernel
          if-no-files-found: warn
