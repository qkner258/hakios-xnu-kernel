name: build-cas-kernel
on:
  workflow_dispatch:
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      XNU_SRC: ${{ github.workspace }}/out/xiaomi-mi-10/xnu
      KERNEL: ${{ github.workspace }}/out/xiaomi-mi-10/xnu/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang lld llvm libssl-dev uuid-dev flex bison m4 perl python3 autoconf automake libtool pkg-config
      # The device layer is not committed here: it is the upstream UMI tree, pinned by its HEAD.
      - name: umi device layer
        run: |
          # Pinned: one variable per round means the device layer must not move under us.
          git init -q /tmp/umi
          git -C /tmp/umi remote add origin https://github.com/xm6661885/hakios-xnu-kernel-umi-fixes
          if git -C /tmp/umi fetch -q --depth 1 origin a5f9d5e; then
            git -C /tmp/umi checkout -q FETCH_HEAD
          else
            echo "::warning::commit a5f9d5e not fetchable; building HEAD instead"
            git -C /tmp/umi fetch -q --depth 1 origin HEAD && git -C /tmp/umi checkout -q FETCH_HEAD
          fi
          git -C /tmp/umi log --oneline -1
          rm -rf devices/xiaomi-mi-10
          mkdir -p devices
          cp -a /tmp/umi/devices/xiaomi-mi-10 devices/
          ls devices/xiaomi-mi-10 | head -5
      - name: toolchain identity
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def sh(*a):
              try:
                  return subprocess.run(a, capture_output=True, text=True).stdout.strip()
              except Exception:
                  return ""
          doc = {
              "runner": "ubuntu-24.04",
              "xnu_source": "apple-oss-distributions/xnu xnu-8796.121.2",
              "darwin": "22.5.0",
              "target_system": {"version": "16.5", "build": "20F66"},
              "kernel_config": "DEVELOPMENT_ARM64_BCM2837",
              "page_size": 4096,
              "framework": sh("git", "rev-parse", "HEAD"),
              "device_layer": sh("git", "-C", "/tmp/umi", "rev-parse", "HEAD"),
              "clang": (sh("clang", "--version").splitlines() or [""])[0],
          }
          out = pathlib.Path("out/toolchain.json")
          out.write_text(json.dumps(doc, indent=2) + "\n")
          print(out.read_text())
          PY

      - name: theos
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/theos/theos "$HOME/theos"
          cd "$HOME/theos"
          ok=0
          for i in 1 2 3; do
            if yes | bash bin/install-theos; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" = 1 ] || echo "::warning::theos install did not finish (SDK optional)"
      # devices/xiaomi-mi-10/build-kernel.sh is the authority for the order that follows;
      # these steps reproduce it, with the diagnostic patches this kernel needs added in place.
      - name: xnu-source + device overlay
        run: |
          python3 devices/xiaomi-mi-10/prepare.py kernel
          grep -c . "$XNU_SRC/bsd/dev/hakios.adreno.c" || true
      # bsd/dev/umi_bluetooth.c includes umi_bt_firmware.inc; build-kernel.sh makes it from the
      # git-ignored QCA6390 firmware. The script writes an empty array when the firmware is absent.
      # The build directory is made here too, as mk-wlfw.sh requires it to exist.
      - name: bluetooth firmware include + build dir
        run: |
          python3 devices/xiaomi-mi-10/tools/embed-firmware.py \
            --patch fw-bluetooth/htbtfw20.tlv --nvm fw-bluetooth/htnv20.bin \
            --output "$XNU_SRC/bsd/dev/umi_bt_firmware.inc"
          wc -c "$XNU_SRC/bsd/dev/umi_bt_firmware.inc"
          mkdir -p "$XNU_SRC/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/bsd/DEVELOPMENT"
      # Apple's pid 1 candidate list is /sbin/launchd only; our root's init is /sbin/init.
      - name: pid 1 accepts /sbin/init
        run: |
          python3 - "$XNU_SRC/bsd/kern/kern_exec.c" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          if '"/sbin/init"' in s:
              print('pid1: /sbin/init already listed')
              raise SystemExit
          anchor = '\t"/sbin/launchd",\n};\n'
          if anchor not in s:
              raise SystemExit('pid1: init candidate list is not where it was; refusing to guess')
          p.write_text(s.replace(anchor, '\t"/sbin/launchd",\n\t"/sbin/init",\n};\n', 1))
          print('pid1: /sbin/init added')
          PY
      - name: apfs mount trace
        continue-on-error: true
        run: |
          set +e
          echo '' | base64 -d > /tmp/apfs_trace.py
          echo "apfs target: $(ls -l "$XNU_SRC/bsd/miscfs/apfs/apfs_vfsops.c" 2>&1)"
          head -c 60 /tmp/apfs_trace.py; echo
          python3 /tmp/apfs_trace.py "$XNU_SRC/bsd/miscfs/apfs/apfs_vfsops.c"; echo "apfs patch exit: $?"

      - name: display bootlog handover
        continue-on-error: true
        run: |
          set +e
          echo '' | base64 -d > /tmp/bootlog_handover.py
          echo "fb target: $(ls -l "$XNU_SRC/iokit/Kernel/MiniIOMobileFramebuffer.cpp" 2>&1)"
          python3 /tmp/bootlog_handover.py "$XNU_SRC/iokit/Kernel/MiniIOMobileFramebuffer.cpp"; echo "fb patch exit: $?"

          echo "---- the block this run inserted ----"
          grep -n -A 22 "OUR BLOCK (r108)" "$XNU_SRC/iokit/Kernel/MiniIOMobileFramebuffer.cpp" | head -30 || echo "::error::the handover block is not in the file"
          echo "fbentry lines: $(grep -c 'fbentry: show() call' "$XNU_SRC/iokit/Kernel/MiniIOMobileFramebuffer.cpp") (expect 1)"
          echo "---- end ----"

      # The banner comes from hakios_kver on the command line (the payload's word), so it cannot tell one
      # kernel from another. This one is compiled in: if the log does not say KERNEL-BUILD-r108, the kernel
      # that ran was not this build.
      - name: kernel banner marker
        continue-on-error: true
        run: |
          set +e
          echo '' | base64 -d > /tmp/kernel_marker.py
          echo "version file: $(ls -l "$XNU_SRC/bsd/dev/hakios.version.c" 2>&1)"
          python3 /tmp/kernel_marker.py "$XNU_SRC/bsd/dev/hakios.version.c"; echo "marker exit: $?"
          grep -n "KERNEL-BUILD-r108" "$XNU_SRC/bsd/dev/hakios.version.c" || echo "::error::the banner marker is not in the file"

      - name: console goes quiet after handover
        continue-on-error: true
        run: |
          set +e
          echo '' | base64 -d > /tmp/bootlog_export.py
          echo '' | base64 -d > /tmp/console_quiet.py
          python3 /tmp/bootlog_export.py "$XNU_SRC/bsd/dev/umi_bootlog.c"; echo "bootlog export exit: $?"
          echo "serial: $(ls -l "$XNU_SRC/osfmk/console/serial_console.c" 2>&1)"
          python3 /tmp/console_quiet.py "$XNU_SRC/osfmk/console/serial_console.c"; echo "console quiet exit: $?"

      # 屏幕上的滚动日志是 loader 自己打的（note_kernel_progress 每 10 秒把内核日志尾部 240 字节
      # 打到面板），内核侧的 bootlog/console 两道闸都拦不住它。这里编一个 20 秒后闭嘴的 loader。
      - name: quiet loader
        continue-on-error: true
        run: |
          set +e
          echo '' | base64 -d > /tmp/loader_quiet.py
          python3 /tmp/loader_quiet.py devices/xiaomi-mi-10/loader/loader.c; echo "loader patch exit: $?"
          bash devices/xiaomi-mi-10/build-loader.sh; echo "loader build exit: $?"
          ls -l out/xiaomi-mi-10/loader.efi

      - name: deps-xnu
        run: |
          export THEOS="$HOME/theos"
          xnu-deps/setup.sh
      # skip-setup：init 里在跑 /etc/rc 之前写 com.apple.purplebuddy.plist（SetupDone 等）。
      # 这里顺带把改过的 init 编出来；ramdisk（root.apfs）在本地重打，CI 不动它。
      - name: skip-setup init
        continue-on-error: true
        run: |
          set +e
          echo '' | base64 -d > /tmp/skip_setup.py
          python3 /tmp/skip_setup.py userland/src/init.c; echo "patch exit: $?"
          export THEOS="$HOME/theos"
          source xnu-env.sh
          cd userland
          mkdir -p obj
          CC="xnu-clang -arch arm64 -Os -static -nostdlib -ffreestanding -fno-stack-protector -fno-builtin -Wall -Wextra"
          LD="-Wl,-e,_start -Wl,-pagezero_size,0x100000000"
          $CC -Ilibmini -c libmini/mini.c -o obj/mini.o; echo "mini exit: $?"
          $CC -c libmini/start.S -o obj/start.o; echo "start exit: $?"
          $CC -Ilibmini $LD -o obj/init.new src/init.c obj/mini.o obj/start.o; echo "init exit: $?"
          ls -l obj/init.new; file obj/init.new

      - name: build
        run: |
          export THEOS="$HOME/theos"
          export XNU_SRC="$PWD/out/xiaomi-mi-10/xnu"
          export KERNEL="$XNU_SRC/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837"
          ulimit -s unlimited
          set +e
          [ ! -f xnu-deps/build/ath11k/src/ath11k/qmi.c ] || tools/mk-wlfw.sh
          ./xnu-build.sh -k -j4 > /tmp/build.log 2>&1
          echo "xnu-build exit: $?"
          echo "---- first errors ----"
          grep -nE "error:|fatal error|No such file|cannot find|undefined reference" /tmp/build.log | head -40
          echo "---- tail ----"
          tail -40 /tmp/build.log
          KERNEL="$KERNEL" tools/make-kernel.sh --judge /tmp/build.log
      - name: collect
        if: always()
        run: |
          mkdir -p out
          K=$(find out/xiaomi-mi-10 -name 'mach.*unstripped' 2>/dev/null | head -1) || true
          [ -n "$K" ] || K=$(find out/xiaomi-mi-10 -name 'mach.development.bcm2837' 2>/dev/null | head -1) || true
          if [ -n "$K" ]; then
            llvm-strip-18 -S -o out/hakios-kernel "$K" || cp "$K" out/hakios-kernel
            ls -lh out/hakios-kernel
          else
            echo "::error::no kernel produced; see build.log in the artifacts"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-identity
          path: out/toolchain.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-loader
          path: out/xiaomi-mi-10/loader.efi
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skip-setup-init
          path: userland/obj/init.new
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: cas-kernel
          path: out/hakios-kernel
          if-no-files-found: warn
