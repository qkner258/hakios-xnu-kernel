name: build-cas-kernel-deep
on:
  workflow_dispatch:
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang lld llvm libssl-dev uuid-dev flex bison m4 perl python3 autoconf automake libtool pkg-config
      - name: theos
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/theos/theos "$HOME/theos"
          cd "$HOME/theos"
          ok=0
          for i in 1 2 3; do
            if yes | bash bin/install-theos; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" = 1 ] || echo "::warning::theos install did not finish (SDK optional)"
      - name: xnu-source
        run: xnu/apply.sh
