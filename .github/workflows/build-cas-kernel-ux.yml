      - name: deps-xnu
        run: |
          export THEOS="$HOME/theos"
          xnu-deps/setup.sh
      - name: config
        run: make defconfig
      - name: build
        run: |
          export THEOS="$HOME/theos"
          ulimit -s unlimited
          make kernel JOBS=4
      - name: collect
        if: always()
        run: |
          mkdir -p out
          K=$(find xnu-src -name 'mach.*unstripped' | head -1) || true
          if [ -n "$K" ]; then
            llvm-strip-18 -S -o out/hakios-kernel-dbg "$K" || cp "$K" out/hakios-kernel-dbg
          fi
          ls -l out || true
      - uses: actions/upload-artifact@v4
        with:
          name: cas-kernel-ux
          path: out/hakios-kernel-dbg
